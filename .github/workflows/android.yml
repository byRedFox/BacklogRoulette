# Сборка Android-приложения на GitHub: при каждом push в ветку android (если менялась папка android)
# и по кнопке «Run workflow». Готовый APK — во вкладке Actions → сборка → Artifacts.
name: Android

on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.2"

      - name: Собрать APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Контрольная сумма
        working-directory: android/app/build/outputs/apk/debug
        run: sha256sum *.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BacklogRoulette-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14
