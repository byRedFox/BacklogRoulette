# Сборка Android-приложения на GitHub: при каждом push в ветку android (если менялась папка android)
# и по кнопке «Run workflow». Готовый APK — во вкладке Actions → сборка → Artifacts.
# Подпись — постоянным ключом из секретов репозитория (Settings → Secrets and variables → Actions):
#   BR_KEYSTORE_BASE64 — файл ключа в base64, BR_KEYSTORE_PASSWORD — его пароль.
# Без них сборка останавливается: неподписанный APK не установить, а другой подписью — не обновить.
name: Android

on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04 # постоянная версия: ubuntu-latest переезжает на Ubuntu 26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.2"

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.BR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Нет секретов BR_KEYSTORE_BASE64 и BR_KEYSTORE_PASSWORD — см. начало android.yml"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Собрать APK
        working-directory: android
        env:
          BR_KEYSTORE_PASSWORD: ${{ secrets.BR_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Контрольная сумма
        working-directory: android/app/build/outputs/apk/release
        run: |
          mv app-release.apk BacklogRoulette-android.apk
          sha256sum BacklogRoulette-android.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: BacklogRoulette-android
          path: |
            android/app/build/outputs/apk/release/BacklogRoulette-android.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          retention-days: 14
